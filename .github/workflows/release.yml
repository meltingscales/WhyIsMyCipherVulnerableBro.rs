# Releases: on a v* tag, build optimized binaries for every target, then
# publish only after the whole matrix succeeds. Native runners (not cross)
# keep the mac/windows toolchains reliable; pinned macos labels because the
# -latest alias has drifted architectures before.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # Both Apple targets build on the arm64 runner: Xcode
          # cross-compiles x86_64 natively, and free macos-13 (Intel)
          # runners have become unobtainably scarce.
          - os: macos-15
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          stem="why_is_my_cipher_vulnerable_bro-v${version}-${{ matrix.target }}"
          mkdir -p "dist/$stem"
          bin="target/${{ matrix.target }}/release/why_is_my_cipher_vulnerable_bro"
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            cp "$bin.exe" "dist/$stem/"
          else
            cp "$bin" "dist/$stem/"
          fi
          cp README.md "dist/$stem/"
      # Archive from outside dist/ — tar refuses to read a directory
      # while the archive is being written into it.
      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -czf artifact.tar.gz -C dist .
      # git-bash on windows runners has no zip(1); PowerShell does it.
      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath artifact.zip
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: artifact.*

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release with all archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes
